name: Release

# Runs when you publish a release on GitHub. Builds main.js from the source,
# creates artifact attestations and attaches main.js, manifest.json and
# styles.css to the release.

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check that manifest version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json has version $VERSION, but the release tag is $TAG"
            exit 1
          fi

      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
